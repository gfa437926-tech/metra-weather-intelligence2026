name: METRA application CI

on:
  push:
    branches:
      - work/database-architecture-fresh-design-2026-11-14
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # These checks validate the retained Edge Function source only.
      # The deployed functions are not compatible with the greenfield schema yet.
      - name: Type-check retained Edge Functions
        run: |
          deno check --no-lock supabase/functions/station-directory/index.ts
          deno check --no-lock supabase/functions/registration/index.ts
          deno check --no-lock supabase/functions/registration-approvals/index.ts
          deno check --no-lock supabase/functions/observations/index.ts
          deno check --no-lock supabase/functions/station-review/index.ts
      - name: Test Edge Function validation and authorization helpers
        run: |
          deno test --no-lock supabase/functions/registration-approvals/validation_test.ts
          deno test --no-lock supabase/functions/registration-approvals/batching_test.ts
          deno test --no-lock supabase/functions/station-directory/permissions_test.ts
          deno test --no-lock supabase/functions/observations/validation_test.ts
          deno test --no-lock supabase/functions/station-review/validation_test.ts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze application source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: metra-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 14

  dotnet-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API and tests
        run: dotnet restore src/Metra.Api.Tests/Metra.Api.Tests.csproj
      - name: Run API authorization tests
        run: dotnet test src/Metra.Api.Tests/Metra.Api.Tests.csproj --configuration Release --no-restore
      - name: Build API
        run: dotnet build src/Metra.Api/Metra.Api.csproj --configuration Release --no-restore
