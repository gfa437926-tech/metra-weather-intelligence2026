name: METRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  aspnet-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore API tests
        run: dotnet restore backend/Metra.Api.Tests/Metra.Api.Tests.csproj
      - name: Build ASP.NET Core API
        run: dotnet build backend/Metra.Api/Metra.Api.csproj --configuration Release --no-restore
      - name: Run ASP.NET Core API tests
        run: dotnet test backend/Metra.Api.Tests/Metra.Api.Tests.csproj --configuration Release

  flutter-and-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check --no-lock supabase/functions/station-directory/index.ts
      - name: Type-check registration Edge Function
        run: deno check --no-lock supabase/functions/registration/index.ts
      - name: Type-check registration approvals Edge Function
        run: deno check --no-lock supabase/functions/registration-approvals/index.ts
      - name: Test registration approval transaction response validation
        run: deno test --no-lock supabase/functions/registration-approvals/validation_test.ts
      - name: Test registration approval query batching
        run: deno test --no-lock supabase/functions/registration-approvals/batching_test.ts
      - name: Type-check observations Edge Function
        run: deno check --no-lock supabase/functions/observations/index.ts
      - name: Test Supabase Edge Function permission rules
        run: deno test --no-lock supabase/functions/station-directory/permissions_test.ts
      - name: Test operational observation payload validation
        run: deno test --no-lock supabase/functions/observations/validation_test.ts
      - name: Type-check station catalogue review Edge Function
        run: deno check --no-lock supabase/functions/station-review/index.ts
      - name: Test station catalogue review validation
        run: deno test --no-lock supabase/functions/station-review/validation_test.ts
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze application source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Upload web release
        uses: actions/upload-artifact@v4
        with:
          name: metra-web-release
          path: build/web
          if-no-files-found: error
          retention-days: 14
