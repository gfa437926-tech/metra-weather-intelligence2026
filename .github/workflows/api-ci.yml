name: METRA API CI

on:
  push:
    branches:
      - work/database-architecture-fresh-design-2026-11-14
  pull_request:
    branches:
      - main

concurrency:
  group: metra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API and tests
        run: dotnet restore src/Metra.Api.Tests/Metra.Api.Tests.csproj

      - name: Run API unit tests
        run: dotnet test src/Metra.Api.Tests/Metra.Api.Tests.csproj --configuration Release --no-restore

      - name: Build API
        run: dotnet build src/Metra.Api/Metra.Api.csproj --configuration Release --no-restore

      - name: Build API container
        run: docker build --tag metra-api:ci .

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rebuild an isolated database and run API integration tests
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          trap 'supabase stop --no-backup' EXIT
          supabase db reset --local --yes

          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role metra_api_test_login
            login inherit nosuperuser nocreatedb nocreaterole noreplication nobypassrls
            password 'metra-local-test-only'
            in role metra_api_runtime;
          SQL

          DB_PARTS="$(python3 - "$DB_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          parsed = urlparse(sys.argv[1])
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("Unexpected local Supabase DB_URL")
          print(f"{parsed.hostname}|{parsed.port or 5432}|{(parsed.path or '/postgres').lstrip('/')}")
          PY
          )"
          IFS='|' read -r DB_HOST DB_PORT DB_NAME <<< "$DB_PARTS"
          export METRA_TEST_DATABASE_CONNECTION_STRING="Host=$DB_HOST;Port=$DB_PORT;Database=$DB_NAME;Username=metra_api_test_login;Password=metra-local-test-only;Pooling=false;"
          dotnet test src/Metra.Api.Tests/Metra.Api.Tests.csproj \
            --configuration Release --no-restore \
            --filter FullyQualifiedName~MetraApiIntegrationTests
