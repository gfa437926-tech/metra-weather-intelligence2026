name: METRA API CI

on:
  push:
    branches:
      - work/database-architecture-fresh-design-2026-11-14
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API and tests
        run: dotnet restore src/Metra.Api.Tests/Metra.Api.Tests.csproj

      - name: Run API unit tests
        run: dotnet test src/Metra.Api.Tests/Metra.Api.Tests.csproj --configuration Release --no-restore

      - name: Build API
        run: dotnet build src/Metra.Api/Metra.Api.csproj --configuration Release --no-restore

      - name: Build API container
        run: docker build --tag metra-api:ci .
