name: Generate Supabase migration source with CLI

on:
  push:
    branches:
      - work/database-architecture-fresh-design-2026-11-14
    paths-ignore:
      - 'supabase/migrations/**'

permissions:
  contents: write

jobs:
  generate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: work/database-architecture-fresh-design-2026-11-14

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate migration file through Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration --help
          supabase migration new --help
          mkdir -p supabase/migrations
          if ! find supabase/migrations -maxdepth 1 -type f -name '*_metra_registration_review_permissions_and_father_name.sql' | grep -q .; then
            supabase migration new metra_registration_review_permissions_and_father_name
          fi
          if ! find supabase/migrations -maxdepth 1 -type f -name '*_metra_api_runtime_privileges.sql' | grep -q .; then
            supabase migration new metra_api_runtime_privileges
          fi

      - name: Commit generated migration source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "No new migration source file was required."
            exit 0
          fi
          git commit -m "chore(db): generate migration source with Supabase CLI"
          git push origin HEAD:work/database-architecture-fresh-design-2026-11-14
