name: Verify METRA migration rebuild

on:
  push:
    branches:
      - work/database-architecture-fresh-design-2026-11-14
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/pending-migrations/**"
      - "supabase/config.toml"
      - "scripts/verify_migration_source.py"
      - ".github/workflows/migration-source-generator.yml"

permissions:
  contents: read

jobs:
  source-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration source coverage
        run: python3 scripts/verify_migration_source.py

  clean-database-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Replay all migrations against a fresh local database
        run: supabase db reset --local --yes
      - name: Verify rebuilt schema and migration ledger
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare
            v_table_count integer;
            v_rls_count integer;
            v_migration_count integer;
          begin
            select count(*) into v_table_count
            from pg_tables
            where schemaname in ('iam','catalog','ref','observations','weather','alerts','operations','files','integration','audit');

            select count(*) into v_rls_count
            from pg_tables
            where schemaname in ('iam','catalog','ref','observations','weather','alerts','operations','files','integration','audit')
              and rowsecurity;

            select count(*) into v_migration_count
            from supabase_migrations.schema_migrations;

            if v_table_count <> 46 then
              raise exception 'Expected 46 METRA tables, found %', v_table_count;
            end if;
            if v_rls_count <> 46 then
              raise exception 'Expected RLS on all 46 METRA tables, found %', v_rls_count;
            end if;
            if v_migration_count <> 86 then
              raise exception 'Expected 86 migration ledger rows, found %', v_migration_count;
            end if;
            if to_regclass('public.station_catalogue') is not null then
              raise exception 'Legacy public.station_catalogue unexpectedly exists in greenfield schema';
            end if;
          end
          $verify$;
          SQL
      - name: Stop isolated local Supabase stack
        if: always()
        run: supabase stop --no-backup
